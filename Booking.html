<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Réserver | NAYANA Beauté Indienne</title>

  <style>
    :root{
      --pink:#c2185b;
      --deep:#2f1823;
      --soft:#fff4f8;
      --ink:#2b1b24;
      --white:#fff;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(135deg,#fff,#fff4f8);
      color:var(--ink);
    }

    .booking{
      max-width:700px;
      margin:auto;
      padding:45px 20px;
    }

    .logo{
      text-align:center;
      margin-bottom:15px;
    }

    .logo img{
      width:75px;
      height:75px;
      object-fit:contain;
    }

    .eyebrow{
      text-align:center;
      color:var(--pink);
      font-weight:800;
      letter-spacing:2px;
      margin-top:10px;
    }

    h1{
      text-align:center;
      font-family:Georgia,serif;
      font-size:42px;
      margin:8px 0;
      color:var(--deep);
    }

    .intro{
      text-align:center;
      color:#6f5963;
      margin-bottom:30px;
    }

    .box{
      background:#fff;
      border:1px solid #efd2df;
      border-radius:25px;
      padding:28px;
      box-shadow:0 8px 25px rgba(80,20,45,.08);
    }

    label{
      display:block;
      color:var(--pink);
      font-weight:700;
      margin:18px 0 7px;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:14px;
      border:1px solid #dfc7d2;
      border-radius:12px;
      font-size:16px;
      background:#fff;
      color:var(--ink);
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    .btn{
      display:block;
      width:100%;
      margin-top:25px;
      padding:16px;
      border:0;
      border-radius:30px;
      background:#25D366;
      color:#fff;
      font-size:18px;
      font-weight:800;
      cursor:pointer;
    }

    .back{
      display:block;
      text-align:center;
      margin-top:22px;
      color:var(--pink);
      text-decoration:none;
      font-weight:700;
    }

    .note{
      margin-top:18px;
      text-align:center;
      font-size:13px;
      color:#806b75;
    }

    @media(max-width:600px){
      .booking{
        padding:30px 15px;
      }

      h1{
        font-size:34px;
      }

      .box{
        padding:22px;
      }
    }
  </style>
</head>

<body>

  <main class="booking">

    <div class="logo">
      <img src="nayana-logo-final.png" alt="NAYANA Beauté Indienne">
    </div>

    <div class="eyebrow">NAYANA BEAUTÉ INDIENNE</div>

    <h1>Réserver</h1>

    <p class="intro">
      Choisissez votre prestation, la date et l'heure souhaitées.
    </p>

    <div class="box">

      <form id="bookingForm">

        <label for="service">Prestation</label>

        <div id="serviceOptions" class="service-options">

  <label>
    <input type="checkbox" name="service" value="Beauté des pieds">
    Beauté des pieds
  </label>

  <label>
    <input type="checkbox" name="service" value="Faux ongles en résine">
    Faux ongles en résine
  </label>

  <label>
    <input type="checkbox" name="service" value="Faux ongles au gel">
    Faux ongles au gel
  </label>

  <label>
    <input type="checkbox" name="service" value="Travail de cils">
    Travail de cils
  </label>

  <label>
    <input type="checkbox" name="service" value="Piercing">
    Piercing
  </label>

  <label>
    <input type="checkbox" name="service" value="Henné">
    Henné
  </label>

  <label>
    <input type="checkbox" name="service" value="Maquillage">
    Maquillage
  </label>

  <label>
    <input type="checkbox" name="service" value="Épilation au fil">
    Épilation au fil
  </label>

  <label>
    <input type="checkbox" name="service" value="Épilation à la cire">
    Épilation à la cire
  </label>

  <label>
    <input type="checkbox" name="service" value="Forfait épilation">
    Forfait épilation
  </label>

  <label>
    <input type="checkbox" name="service" value="Soin du visage">
    Soin du visage
  </label>

  <label>
    <input type="checkbox" name="service" value="Massage corporel">
    Massage corporel
  </label>

  <label>
    <input type="checkbox" name="service" value="Manucure">
    Manucure
  </label>

  <label>
    <input type="checkbox" name="service" value="Semi-permanent">
    Semi-permanent
  </label>

</div>

<div id="serviceDetails"></div>

        <label for="date">Date souhaitée</label>
        <input type="date" id="date" required>

        <label for="time">Heure souhaitée</label>
        <input type="time" id="time" required>

        <label for="name">Votre nom</label>
        <input type="text" id="name" placeholder="Votre nom" required>

        <label for="phone">Téléphone</label>
        <input type="tel" id="phone" placeholder="Votre numéro" required>

        <label for="message">Message (facultatif)</label>
        <textarea id="message"
          placeholder="Informations supplémentaires..."></textarea>

        <button type="submit" class="btn">
          💬 Confirmer ma réservation sur WhatsApp
        </button>

      </form>

      <p class="note">
        Votre demande sera envoyée directement par WhatsApp.
      </p>

    </div>

    <a href="index.html" class="back">
      ← Retour au site
    </a>

  </main>

  <script>
const serviceDetails = {
  "Beauté des pieds": [
    ["Beauté des pieds (40 min)", "30 €"],
    ["Manucure complète + beauté des pieds, soins des cuticules", "46 €"]
  ],

  "Faux ongles en résine": [
    ["Avec French", "30 €"],
    ["Avec vernis simple", "35 €"],
    ["Avec semi-permanent", "45 €"],
    ["Baby boomer", "50 €"],
    ["Remplissage", "20 €"],
    ["Enlever faux ongles", "10 €"],
    ["Dessin d’un ongle", "1 €"]
  ],

  "Manucure": [
    ["Pose de vernis + limage", "10 €"],
    ["Manucure simple vernis", "15 €"],
    ["Manucure simple French", "20 €"]
  ],

  "Semi-permanent": [
    ["Vernis couleur", "20 €"],
    ["French", "25 €"],
    ["Baby boomer semi-permanent", "28 €"],
    ["Manucure complète + vernis couleur", "35 €"],
    ["Manucure complète + vernis French", "40 €"],
    ["Manucure complète + beauté des pieds", "75 €"],
    ["Manucure complète + beauté des pieds (French, mains et pieds)", "85 €"],
    ["Beauté des pieds + vernis couleur", "40 €"],
    ["Beauté des pieds + French", "45 €"]
  ]
};

function showServiceDetails() {

  const params = new URLSearchParams(window.location.search);

  const serviceParam = params.get("service");
  const subServiceParam = params.get("subService");

  const serviceSelect = document.getElementById("service");
  const box = document.getElementById("serviceDetails");

  if (serviceParam && serviceSelect) {
    serviceSelect.value = serviceParam;
  }

  const service = serviceSelect.value;

  box.innerHTML = "";

  if (!service || !serviceDetails[service]) return;

  const title = document.createElement("h3");
  title.textContent = service;
  box.appendChild(title);

  serviceDetails[service].forEach(function(item) {

    const label = document.createElement("label");
    label.className = "subservice-option";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.name = "subService";
    checkbox.value = service + " - " + item[0] + " - " + item[1];

    const text = document.createElement("span");
    text.textContent = item[0] + " - " + item[1];

    label.appendChild(checkbox);
    label.appendChild(text);

    box.appendChild(label);

    if (subServiceParam && item[0] === subServiceParam) {
      checkbox.checked = true;
    }

  });
}
        document.getElementById("time").value;

      const name =
        document.getElementById("name").value;

      const phone =
        document.getElementById("phone").value;

      const message =
        document.getElementById("message").value;

      const text =
`Bonjour NAYANA Beauté Indienne 🌸

Je souhaite prendre rendez-vous.

💅 Prestation : ${service}
📅 Date : ${date}
🕐 Heure : ${time}

👤 Nom : ${name}
📱 Téléphone : ${phone}

📝 Message :
${message || "Aucun"}

Merci.`;

      const whatsapp =
        "https://wa.me/33744895687?text=" +
        encodeURIComponent(text);

      window.open(whatsapp, "_blank");

    });

  </script>

</body>
</html>
