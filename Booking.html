<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Réserver | NAYANA Beauté Indienne</title>

  <style>
    :root{
      --pink:#c2185b;
      --deep:#2f1823;
      --soft:#fff4f8;
      --ink:#2b1b24;
      --white:#fff;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(135deg,#fff,#fff4f8);
      color:var(--ink);
    }

    .booking{
      max-width:700px;
      margin:auto;
      padding:45px 20px;
    }

    .logo{
      text-align:center;
      margin-bottom:15px;
    }

    .logo img{
      width:75px;
      height:75px;
      object-fit:contain;
    }

    .eyebrow{
      text-align:center;
      color:var(--pink);
      font-weight:800;
      letter-spacing:2px;
      margin-top:10px;
    }

    h1{
      text-align:center;
      font-family:Georgia,serif;
      font-size:42px;
      margin:8px 0;
      color:var(--deep);
    }

    .intro{
      text-align:center;
      color:#6f5963;
      margin-bottom:30px;
    }

    .box{
      background:#fff;
      border:1px solid #efd2df;
      border-radius:25px;
      padding:28px;
      box-shadow:0 8px 25px rgba(80,20,45,.08);
    }

    label{
      display:block;
      color:var(--pink);
      font-weight:700;
      margin:18px 0 7px;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:14px;
      border:1px solid #dfc7d2;
      border-radius:12px;
      font-size:16px;
      background:#fff;
      color:var(--ink);
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    .btn{
      display:block;
      width:100%;
      margin-top:25px;
      padding:16px;
      border:0;
      border-radius:30px;
      background:#25D366;
      color:#fff;
      font-size:18px;
      font-weight:800;
      cursor:pointer;
    }

    .back{
      display:block;
      text-align:center;
      margin-top:22px;
      color:var(--pink);
      text-decoration:none;
      font-weight:700;
    }

    .note{
      margin-top:18px;
      text-align:center;
      font-size:13px;
      color:#806b75;
    }

    @media(max-width:600px){
      .booking{
        padding:30px 15px;
      }

      h1{
        font-size:34px;
      }

      .box{
        padding:22px;
      }
    }
  </style>
</head>

<body>

  <main class="booking">

    <div class="logo">
      <img src="nayana-logo-final.png" alt="NAYANA Beauté Indienne">
    </div>

    <div class="eyebrow">NAYANA BEAUTÉ INDIENNE</div>

    <h1>Réserver</h1>

    <p class="intro">
      Choisissez votre prestation, la date et l'heure souhaitées.
    </p>

    <div class="box">

      <form id="bookingForm">

        <label for="service">Prestation</label>

        <select id="service" name="service" multiple required onchange="showServiceDetails()">
  <option value="">Choisissez une prestation</option>
  <option value="Beauté des pieds">Beauté des pieds</option>
  <option value="Faux ongles en résine">Faux ongles en résine</option>
  <option value="Faux ongles au gel">Faux ongles au gel</option>
  <option value="Travail de cils">Travail de cils</option>
  <option value="Piercing">Piercing</option>
  <option value="Henné">Henné</option>
  <option value="Maquillage">Maquillage</option>
  <option value="Épilation au fil">Épilation au fil</option>
  <option value="Épilation à la cire">Épilation à la cire</option>
  <option value="Forfait épilation">Forfait épilation</option>
  <option value="Soin du visage">Soin du visage</option>
 <option value="Massage Corporel">Massage Corporel</option>
  <option value="Manucure">Manucure</option>
 <option value="Manucure complet">Manucure complet</option> 
  <option value="Semi-permanent">Semi-permanent</option>
</select>

<div id="serviceDetails"></div>



        <label for="date">Date souhaitée</label>
        <input type="date" id="date" required>

        <label for="time">Heure souhaitée</label>
        <input type="time" id="time" required>

        <label for="name">Votre nom</label>
        <input type="text" id="name" placeholder="Votre nom" required>

        <label for="phone">Téléphone</label>
        <input type="tel" id="phone" placeholder="Votre numéro" required>

        <label for="message">Message (facultatif)</label>
        <textarea id="message"
          placeholder="Informations supplémentaires..."></textarea>

        <button type="submit" class="btn">
          💬 Confirmer ma réservation sur WhatsApp
        </button>

      </form>

      <p class="note">
        Votre demande sera envoyée directement par WhatsApp.
      </p>

    </div>

    <a href="index.html" class="back">
      ← Retour au site
    </a>

  </main>

  <script>
const serviceDetails = {

  ],

  "Faux ongles au gel": [
    ["Faux ongles avec French", "35 €"],
    ["Faux ongles avec vernis simple", "40 €"],
    ["Faux ongles avec semi permanent", "50 €"],

  ],

    ["Coloration Des Sourcils", "8 €"]
  ],

  "Épilation à la cire": [
    ["Sourcils", "6 €"],

    ["Aisselles", "9 €"],

    ["Demi bras", "10 €"],

    ["Demi jambes", "15 €"],

  ],

  "Forfait épilation": [

    ["L'image, gommage, modelage, vernis simple, soin du cuticules", "20 €"],
    ["L'image, gommage, modelage, vernis French, soin du cuticules", "25 €"]
  ],

  "Semi-permanent": [
    ["Vernis couleur", "20 €"],
    ["French", "25 €"],
    ["Baby boomer semi permanent", "28 €"],

    ["Manucure complet + vernis French", "40 €"],
    ["Manucure complet + beauté des pieds", "75 €"],

    ["Beauté des pieds + French", "45 €"]
  ]

};

function showServiceDetails() {
  const serviceSelect = document.getElementById("service");
  const box = document.getElementById("serviceDetails");

  if (!serviceSelect || !box) return;

  box.innerHTML = "";

  const selectedServices = Array.from(serviceSelect.selectedOptions)
    .map(option => option.value)
    .filter(value => value);

  if (selectedServices.length === 0) return;

  selectedServices.forEach(function(service, serviceIndex) {

    if (!serviceDetails[service]) return;

    const title = document.createElement("h3");
    title.textContent = service;
    box.appendChild(title);

    serviceDetails[service].forEach(function(item) {

      const label = document.createElement("label");
      label.className = "subservice-option";

      const radio = document.createElement("input");
      radio.type = "checkbox";

      // ஒவ்வொரு service-க்கும் தனி radio group
      radio.name = "subService-" + serviceIndex + "-" + item[0];

      radio.value = service + " - " + item[0] + " - " + item[1];

      

      const text = document.createElement("span");
      text.textContent = item[0] + " - " + item[1];

      label.appendChild(radio);
      label.appendChild(text);

      box.appendChild(label);
    });
  });
}
      /* BOOKING FORM */
document.getElementById("bookingForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const date =
        document.getElementById("date").value;

    const time =
        document.getElementById("time").value;

    const name =
        document.getElementById("name").value;

    const phone =
        document.getElementById("phone").value;

    const message =
        document.getElementById("message").value;

    /* Get selected services */
const selectedServices = Array.from(
    document.getElementById("service").selectedOptions
)
.map(option => option.value)
.filter(value => value);

/* Get ALL selected options */
const selectedOptions = Array.from(
    document.querySelectorAll('#serviceDetails input[type="checkbox"]:checked')
)
.map(option => option.value);

/* Calculate total price */
const total = selectedOptions.reduce((sum, item) => {
    const match = item.match(/(\d+(?:[.,]\d+)?)\s*€/);

    if (!match) return sum;

    return sum + parseFloat(match[1].replace(",", "."));
}, 0);

/* Format selected services */
const servicesText = selectedServices.length > 0
    ? selectedServices.map(service => "• " + service).join("\n")
    : "• Aucune prestation sélectionnée";

/* Format selected options */
const optionsText = selectedOptions.length > 0
    ? selectedOptions.map(item => "• " + item).join("\n")
    : "• Aucune option sélectionnée";

/* Create professional WhatsApp message */
const text = `🌸 NAYANA BEAUTÉ INDIENNE 🌸

📋 DEMANDE DE RENDEZ-VOUS

💅 Prestations :
${servicesText}

✨ Options sélectionnées :
${optionsText}

💰 TOTAL : ${total.toFixed(2).replace(".", ",")} €

📅 Date : ${date}
🕐 Heure : ${time}

👤 Nom : ${name}
📱 Téléphone : ${phone}

📝 Message :
${message || "Aucun"}

Merci pour votre réservation 🌸
À bientôt chez NAYANA Beauté Indienne ❤️`;

/* Open WhatsApp */
const whatsapp =
    "https://wa.me/33744895687?text=" +
    encodeURIComponent(text);

window.open(whatsapp, "_blank");
});

  </script>

</body>
</html>
